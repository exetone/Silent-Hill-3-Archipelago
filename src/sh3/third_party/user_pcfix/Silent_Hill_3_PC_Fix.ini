[Security]
# Enabling this could fix crashes on some PCs
# Value 1 = Block some third party dll files
# Value 2 = Block all third party dll files
# Use value 0 to disable this patch
BlockThirdPartyDlls = 0

[Log]
# Enable to print debug info from Silent_Hill_3_PC_Fix.dll to a log file or console
# Value 1 = Log file
# Value 2 = Console
Log = 0

# Enable to print debug info from the game to a log file or console
LogGameDebugMsg = 0
LogMapDebugMsg = 0

# Install an exception handler to create minidump files on a crash
# Value 1 = UnhandledExceptionFilter
# Value 2 = VectoredExceptionHandler
InstallExceptionHandler = 1

[Audio]
# Enable this if the game has been muted due to a crash or a force-quit during the TV or Lisa scene
FixAudio = 0

# Double the size for buffers used by ADX
DoubleADXBufferSize = 1

[GameWindow]
# 0 = Japanese
# 1 = English
# 2 = French
# 3 = German
# 4 = Italian
# 5 = Spanish
# 6 = Korean
# 7 = Chinese

# Selecting the language you want to use here will fix a bug that can cause the language to change while playing the game
# Use value 8 to disable this patch
Language = 1

# Regenerate disp.ini at every start
# Recommended unless graphics settings are changed in-game
# Use value 0 to disable this patch
RegenerateDisp = 1

# Set screen resolution width
# No max value
# Use value 0 for automatic detection (Recommended)
ScreenWidth = 0

# Set screen resolution height
# No max value
# Use value 0 for automatic detection (Recommended)
ScreenHeight = 0

# Set render width
# No max value
# Use value 0 for automatic detection (Recommended)
# If not 0 use same value as ScreenWidth
RenderWidth = 0

# Set render height
# No max value
# Use value 0 for automatic detection (Recommended)
# If not 0 use same value as ScreenHeight
RenderHeight = 0

# Run the game in windowed mode
WindowedMode = 0

# Run the game without borders
Borderless = 0

# Set the window x position for borderless windowed mode, 0 is default
Windowx = 0

# Set the window y position for borderless windowed mode, 0 is default
Windowy = 0

# When enabled the game can use multiple CPU cores
# With value 1 one core is used for all threads
# With value 2 the OS will decide which cores to use execpt the audio threads which will always be on the first core
# With value 3 the OS will decide which cores to use for all threads
# With value 4 and 5 two cores are used in different configurations
# With value 6 three cores are used
# Use value 0 to disable this patch
ProcessAffinity = 3

[Graphics]
# 2D elements will be displayed in 4:3
# Use value 0 to disable this patch
Fix2DElements = 1

# When enabled maps will be stretched to the aspect ratio of your monitor
# Fix2DElements must be enabled above
# Use value 0 to disable this patch
StretchMaps = 0

# Change depth of field resolution
# Max value is 4096
# Use value 0 to disable this patch
# This value will affect performance
DOFResolution = 1024

# Change shadow resolution
# No max value
# Use value 0 to disable this patch
# This value will affect performance
ShadowResolution = 1024

# Change inventory resolution
# Max value is 1024
# Use value 0 to disable this patch
# This value will affect performance
InventoryResolution = 1024

# Change status screen resolution
# Max value is 4096
# Use value 0 to disable this patch
# This value will affect performance
StatusScreenResolution = 1024

# Modify the complexity of the fog effect
# Lower value gives more complex fog
# No max/min value
# Use value 0 to disable this patch
# This value will affect performance
FogComplexity = 170

# Sets the correct FOV for your monitor
# Use value 0 to disable this patch
IncreaseGameplayFOV = 1

# Decrease the FOV in cutscenes, IncreaseGameplayFOV must be enabled above
# Use value 0 to disable this patch
DecreaseFOVInCutscenes = 1

# Set Vertical FOV in cutscenes, DecreaseFOVInCutscenes must be enabled above
# Enable Log above to see the original FOV used
# Use value 0.0 to disable this patch
VerticalCutsceneFOV = 0.0

# 0 = Original
# 1 = ThirteenAG's FPS patch (Recommended)
# 2 = Locked to 30 fps
FPSModes = 1

# Set the framerate to 30 in the hospital storeroom (Mirror Room)
# Necessary for the visual and audio effects to play correctly
# FPSModes must be set to 1 above
# Use value 0 to disable this patch
LimitFPSInStoreroom = 1

[DirectX]
# Hook DirectX
# Use value 0 to disable this patch
HookDX = 1

# Render with DirectX 12
# HookDX must be enabled above
# Use value 0 to disable this patch
UseDirectX12 = 0

# This option will disable Maximized Windowed Mode on Windows 8, Windows 10 and Windows 11
# HookDX must be enabled above
# Use value 0 to disable this patch
DisableMaximizedWindowedMode = 0

# Force VSync, this option is ignored if DisableMaximizedWindowedMode is set to zero
# HookDX must be enabled above
# Use value 0 to disable this patch
ForceVSync = 0

# Enable Anisotropic Texture Filtering
# HookDX must be enabled above
# Use value 0 to disable this patch
# This will affect performance
AnisotropicTextureFiltering = 1

[DirectX_Misc]
# See through walls, hotkey is F1 (The value set here is used at start)
Wallhack = 0

# Disable DirectX Fog, hotkey is F2 (The value set here is used at start)
NoDXFog = 0

# Control gamma levels:
# Hotkey to change color is F6
# Hotkeys to change levels are F7 and F8
# HotKeys must be enabled below
# Set to 1 to enable control
Gamma = 0

# Enable use of the hotkeys above
HotKeys = 0

[SilentHill3]
# Use Windows Toast Notifications to display achievements.
# Disable Focus Assist for games in Windows settings to display them when playing in fullscreen.
# Use value 0 to disable this patch
Achievements = 0

# Replaces all instances of "Hope House" with "Wish House" (English)
# Use value 0 to disable this patch
WishHouse = 0

# Fixes a typo in the subway level (English)
# Use value 0 to disable this patch
SubwayTypo = 1

# Fixes a typo in the apartment level (English)
# Use value 0 to disable this patch
ApartmentTypo = 1

# Adds text in the sewer level that was not included in the english translation
# Use value 0 to disable this patch
MissingSewerText = 1

# Disable safe mode
# Use value 0 to disable this patch
DisableSafeMode = 1

# Remove borders in cutscenes
# Use value 0 to disable this patch
RemoveCutsceneBorders = 1

# Remove the black bars always on screen
# Use value 0 to disable this patch
RemoveBlackBars = 1

# Unlock Silent Hill 2 Easter eggs
# Use value 0 to disable this patch
UnlockSH2EasterEggs = 1

# Fix the options menu
# Use value 0 to disable this patch
FixOptionMenuFreeze = 1

# The pause menu will fill the entire screen
# Use value 0 to disable this patch
FullscreenPauseMenu = 1

# FMVs will be displayed in 4:3 aspect ratio
# Use value 0 to disable this patch
FixFMVs = 1

# FMVs will be displayed in fullscreen, FixFMVs must be enabled above
# Use value 0 to disable this patch
FMVFullscreenMode = 0

# Restore missing dialogue sound that was removed from the PC release
# Lisa.mp3 will not be played if huxx.000 has been replaced with the one from the HD collection
# Use value 0 to disable this patch
RestoreMissingDialogueSound = 1

# Restore missing sound effect after the final boss that was removed from the final version of the game
# FPSModes above must be set to 0 or 1
# Use value 0 to disable this patch
RestoreBetaSound = 0

# This will replace the original save and load code and add new features:
# Save encryption is disabled
# Save checksum is disabled
# A backup of all save files are created in the "SavedataBackup" folder

# Old save files will not load with this enabled
# Use value 0 to disable this patch
NewSaveSystem = 1

# 1 = Easy
# 2 = Normal
# 3 = Hard
# 4 = Extreme 1
# 5 = Extreme 2
# 6 = Extreme 3
# 7 = Extreme 4
# 8 = Extreme 5
# 9 = Extreme 6
# 10 = Extreme 7
# 11 = Extreme 8
# 12 = Extreme 9
# 13 = Extreme X

# NewSaveSystem must be enabled above or trial exe used
# Stored at 0x24 and 0x4E in save files
# Use value 0 to disable this patch
ActionLevel = 2

# 0 = Easy
# 1 = Normal
# 2 = Hard

# NewSaveSystem must be enabled above or trial exe used
# Stored at 0x25 and 0x4F in save files
# Use value 3 to disable this patch
RiddleLevel = 1

# Unlock extra menu options
# NewSaveSystem must be enabled above or trial exe used
# Stored at 0x44, 0x45 and 0x48 in data.sys
# On trial exe this will replace "New Game" with "Extra New Game"
# Use value 0 to disable this patch
UnlockExtraMenuOptions = 1

# This will unlock everything in the game
# You must delete your data.sys in the savedata folder before using this
# The value of UnlockExtraMenuOptions above is ignored when this is enabled
# NewSaveSystem must be enabled above
# Use value 0 to disable this patch
UnlockEverything = 0

# Only used with the trial exe
# This will create a save file in the 2nd slot after the trial trigger allowing the game to be completed
# This will automatically enable NewSaveSystem, leave this disabled to use your own save files from the retail version
# The action level and riddle level can be changed with the options above
TrialSkip = 0

# Only used with the trial exe
# This will skip displaying the trial picture and go directly to the main menu
SkipTrialPicture = 1

[Pictures]
# credit.bmp
CreditWidth = 640
CreditHeight = 480

# Display Credits in 4:3, Fix2DElements must be enabled above
# Use value 0 to disable this patch
CreditIn43 = 1

# kcet.bmp
KcetWidth = 512
KcetHeight = 512

# konami.bmp
KonamiWidth = 512
KonamiHeight = 512

# Display Konami and Kcet logos in 4:3, Fix2DElements must be enabled above
# Use value 0 to disable this patch
LogosIn43 = 1

[Registry]
# Redirect registry values from HKEY_LOCAL_MACHINE to HKEY_CURRENT_USER
RedirectRegistry = 1